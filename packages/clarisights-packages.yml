note: >-
  Clarisights publishes NO first-party API client library / SDK in any registry.
  Its programmatic surface is the Marketing Data MCP server, which is consumed
  by an MCP client over HTTP with the user's own login — there is nothing to
  wrap in an SDK. What IS published first-party on npm is Knit, the company's
  React design-system component library (see components/), plus an npm-less
  Claude plugin distributed straight from GitHub. Because no package here is an
  API client, NO `SDKs` pointer is emitted in apis.yml — the sdk_count check
  measures client libraries for an API and Clarisights has none. PyPI
  (clarisights) 404, RubyGems (clarisights) 404, RubyGems search for
  "clarisights" returned no gems.
