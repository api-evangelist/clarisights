note: >-
  Clarisights publishes one client-side component surface: Knit, the React
  component library implementing its "Knit design language". It is the company's
  internal design system released publicly — it is NOT an embeddable Clarisights
  dashboard, widget, or hosted surface, and it does not call the Clarisights
  platform. There is no embed/iframe/web-component product: dashboards are
  consumed inside app.clarisights.com or exported to Looker Studio, Google
  Sheets, BigQuery, Snowflake and Amazon S3 (see the data-destinations surface).
