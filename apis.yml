aid: clarisights
name: Clarisights
description: >-
  Clarisights is an enterprise marketing analytics platform that unifies
  marketing data from channels, web analytics, attribution platforms, and the
  data warehouse into a single self-service system. Marketing teams explore
  data, build custom dashboards, and generate trustworthy insights without SQL
  or data-engineering support, accelerating reporting cycles and reducing manual
  spreadsheet work. Clarisights also ships a Marketing Data MCP server that
  connects governed marketing data to AI tools such as Claude, ChatGPT, Cursor,
  and Gemini, exposing discovery, query, and report-navigation tools scoped by
  the same workspace access controls as the UI. The platform advertises 50+
  connectors, ISO 27001 certification, and SOC 2 Type 2 attestation.
