  containing one skill. The SKILL.md here is saved VERBATIM from the provider
  repo — API Evangelist authored none of it. The skill drives the Clarisights
  Marketing Data MCP connector (six tools) rather than a REST API, and carries
  13 inline CUSTOMIZE markers the customer fills in; Clarisights also ships a
  Skill Customizer form on the in-app MCP Settings page that generates a filled
  copy.
